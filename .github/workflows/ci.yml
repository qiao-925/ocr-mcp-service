name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@v6

      - name: Sync dev environment
        run: uv sync --extra dev

      - name: Python compile check
        run: uv run python -m compileall -q src/local_ocr_mcp

      - name: Pytest
        run: uv run python -m pytest -q

      - name: CLI help
        run: uv run python -m local_ocr_mcp --help

      - name: stdio smoke
        run: |
          set +e
          timeout 3s uv run python -m local_ocr_mcp >/tmp/local-ocr-mcp-stdio.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            cat /tmp/local-ocr-mcp-stdio.log
            exit "$status"
          fi
