[project]
name = "local-ocr-mcp"
version = "0.2.0"
description = "Minimal stdio-first OCR MCP service powered by PaddleOCR"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Local OCR MCP Team"}
]
license = {text = "MIT"}
keywords = ["ocr", "mcp", "paddleocr", "stdio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp==3.1.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
paddleocr = [
    "paddleocr>=3.0.0",
    "paddlepaddle>=2.6.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
local-ocr-mcp = "local_ocr_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/local_ocr_mcp",
    "README.md",
    "pyproject.toml",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
